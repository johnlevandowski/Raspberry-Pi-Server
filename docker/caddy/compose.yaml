# adapted from https://hub.docker.com/_/caddy
services:
  caddy:
    image: ghcr.io/johnlevandowski/caddy-cloudflare:${CADDY_VERSION}
    container_name: caddy
    hostname: caddy
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN} #from .env file
      - ACME_AGREE=true
      - LANDOMAIN=${LANDOMAIN}
      - TSDOMAIN=${TSDOMAIN}
    volumes:
      - ./site:/srv
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      caddy_network:
        ipv4_address: '172.21.21.2'
    #secrets:
    #  - CLOUDFLARE_API_TOKEN

volumes:
  caddy_data:
  caddy_config:

networks:
  caddy_network:
    external: true

